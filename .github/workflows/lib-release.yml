name: lib-release
# 正本は .github/tests/fixtures/release-workflow.yml。このファイルを変える PR は、正本も同じ PR で同じように変える。
# 正本と一字一句同じでない（uses: の版だけは違ってよい）と、形のテストはタグの push（lib-bump-version.yml）を許さない。
# ファイル名（lib-release.yml）と name を変えない。crates.io の trusted publishing がこのファイルに結び付いている。
# 設計：設計の追記 design-r6.md §3（v2）。ビルドをするジョブ（package）と、OIDC の token を持つジョブ（publish）を分ける。
# publish ジョブはビルドをしない（第三者のビルドコードが token に届かない）。package ジョブの成果物は信用せず、Cargo.lock だけを使う。
# action はすべて SHA で固定する。Rust はランナーの rustup を直に使う。
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
env:
  CARGO_TERM_COLOR: always
jobs:
  package:
    name: Package and verify the crate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.precheck.outputs.action }}
      artifact: ${{ steps.verified.outputs.artifact }}
      sha256: ${{ steps.verified.outputs.sha256 }}
      cargo: ${{ steps.rust.outputs.cargo }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      # 関門。落ちれば、あとの手順はどれも動かない
      - name: Check the tagged commit against the release gate
        id: release_gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          GATE="${RUNNER_TEMP}/release-gate"
          RELEASE_SHA=$(git rev-parse "${RELEASE_TAG}^{commit}")
          bash "${GITHUB_WORKSPACE}"/.github/release-gate-inputs.sh "$RELEASE_SHA" "$GATE"
          python3 "${GITHUB_WORKSPACE}"/.github/release-gate.py check --mode publish --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA" --on-main "$(cat "${GATE}/on-main")" \
            --parents "${GATE}/parents" \
            --parent-version "${GATE}/parent-version" --version-file "${GATE}/version" \
            --changed-files "${GATE}/changed-files" --pulls "${GATE}/pulls.json" \
            --remote-tags "${GATE}/remote-tags"
      - name: Set up Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo "cargo=$(cargo --version)" >> "$GITHUB_OUTPUT"
      # 関門の読む版、TOML の読む版、cargo の読む版、タグの4つが同じこと（設計 §7 の I18）
      - name: Check the version cargo builds
        id: build_version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          GATE_VERSION=$(python3 "${GITHUB_WORKSPACE}"/.github/release-gate.py read-version)
          TOML_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("lib/Cargo.toml", "rb"))["package"]["version"])')
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 --manifest-path lib/Cargo.toml \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "event-store-adapter-rs"))')
          echo "tag=${RELEASE_TAG}, gate=${GATE_VERSION}, toml=${TOML_VERSION}, cargo=${CRATE_VERSION}"
          for VERSION in "$GATE_VERSION" "$TOML_VERSION" "$CRATE_VERSION"; do
            if [[ "v${VERSION}" != "$RELEASE_TAG" ]]; then
              echo "::error::the versions do not agree with the tag ${RELEASE_TAG}: gate=${GATE_VERSION}, toml=${TOML_VERSION}, cargo=${CRATE_VERSION}"
              exit 1
            fi
          done
      - name: Check crates.io before publishing
        id: precheck
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_SHA=$(git rev-parse "${RELEASE_TAG}^{commit}")
          python3 "${GITHUB_WORKSPACE}"/.github/crates-io.py precheck --version "${RELEASE_TAG#v}" --sha "$RELEASE_SHA"
      # 検証のビルドはこのジョブだけで動く（依存のビルドスクリプトと手続きマクロ）。このジョブに秘密の値と OIDC は無い
      - name: Package and verify the crate
        id: package
        if: steps.precheck.outputs.action == 'publish'
        run: |
          cargo package -p event-store-adapter-rs
      - name: Record the verified crate
        id: verified
        if: steps.precheck.outputs.action == 'publish'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -o pipefail
          CRATE="target/package/event-store-adapter-rs-${RELEASE_TAG#v}.crate"
          mkdir "${RUNNER_TEMP}/verified-crate"
          cp "$CRATE" Cargo.lock "${RUNNER_TEMP}/verified-crate/"
          SHA256=$(sha256sum "$CRATE" | cut -d ' ' -f 1)
          echo "verified ${CRATE}: ${SHA256}"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "artifact=verified-crate-${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload the verified crate
        id: upload_verified
        if: steps.precheck.outputs.action == 'publish'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.verified.outputs.artifact }}
          path: ${{ runner.temp }}/verified-crate
          retention-days: 7
          if-no-files-found: error
  publish:
    name: Publish to crates.io
    needs: package
    if: needs.package.outputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      uploaded: ${{ steps.publish.outputs.uploaded }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      # 関門をもう一度（package ジョブのあとに増えたタグと、待っているあいだの変化を読む）。入力は新しいディレクトリに集める
      - name: Check the release gate again before publishing
        id: release_gate_again
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          GATE="${RUNNER_TEMP}/release-gate-again"
          RELEASE_SHA=$(git rev-parse "${RELEASE_TAG}^{commit}")
          bash "${GITHUB_WORKSPACE}"/.github/release-gate-inputs.sh "$RELEASE_SHA" "$GATE"
          python3 "${GITHUB_WORKSPACE}"/.github/release-gate.py check --mode publish --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA" --on-main "$(cat "${GATE}/on-main")" \
            --parents "${GATE}/parents" \
            --parent-version "${GATE}/parent-version" --version-file "${GATE}/version" \
            --changed-files "${GATE}/changed-files" --pulls "${GATE}/pulls.json" \
            --remote-tags "${GATE}/remote-tags"
      # published（前の試みが上げたあとに落ちた）なら、あとの手順を飛ばして成功で終わる
      - name: Check crates.io again before publishing
        id: precheck_again
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_SHA=$(git rev-parse "${RELEASE_TAG}^{commit}")
          python3 "${GITHUB_WORKSPACE}"/.github/crates-io.py precheck --version "${RELEASE_TAG#v}" --sha "$RELEASE_SHA"
      - name: Set up Rust
        id: rust
        if: steps.precheck_again.outputs.action == 'publish'
        env:
          PACKAGE_CARGO: ${{ needs.package.outputs.cargo }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          CARGO=$(cargo --version)
          if [[ "$CARGO" != "$PACKAGE_CARGO" ]]; then
            echo "::error::cargo is '${CARGO}' here but was '${PACKAGE_CARGO}' in the package job; re-run all jobs"
            exit 1
          fi
      # package ジョブの成果物は信用しない入力。ワークスペースの外の新しいディレクトリへ、名前で取り寄せる（無ければ失敗する）
      - name: Download the verified crate
        id: download_verified
        if: steps.precheck_again.outputs.action == 'publish'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/verified-crate
      # 成果物から使うのは、通常のファイルの Cargo.lock だけ。--no-verify で作り直し（ビルドしない）、SHA-256 を照合する
      - name: Check the crate against the verified one
        id: crate_check
        if: steps.precheck_again.outputs.action == 'publish'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VERIFIED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          python3 "${GITHUB_WORKSPACE}"/.github/crates-io.py copy-lock --from "${RUNNER_TEMP}/verified-crate" \
            --to "${GITHUB_WORKSPACE}/Cargo.lock"
          cargo package --no-verify --locked -p event-store-adapter-rs
          python3 "${GITHUB_WORKSPACE}"/.github/crates-io.py check-crate \
            --crate "target/package/event-store-adapter-rs-${RELEASE_TAG#v}.crate" --sha256 "$VERIFIED_SHA256"
      # 認証のあとは cargo publish の1手順だけ（token の期限。設計 §3）
      - name: Authenticate with crates.io
        id: auth
        if: steps.precheck_again.outputs.action == 'publish'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the crate
        id: publish
        if: steps.precheck_again.outputs.action == 'publish'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish --no-verify --locked -p event-store-adapter-rs
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
  confirm:
    name: Check the sparse index
    needs: [package, publish]
    if: always() && needs.package.result == 'success' && (needs.package.outputs.action == 'published' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      # このジョブの実行で上げたときは、検証した .crate の SHA-256 と、index の cksum・API の checksum を照らし合わせる。
      # published の経路では照合しない（precheck が trustpub_data で、タグのコミットから出た版だと確かめている。設計 §3）
      - name: Check that the sparse index serves the version
        id: confirm
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          UPLOADED: ${{ needs.publish.outputs.uploaded }}
          VERIFIED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          CHECKSUM=()
          if [[ "$UPLOADED" == true ]]; then
            CHECKSUM=(--sha256 "$VERIFIED_SHA256")
          fi
          python3 "${GITHUB_WORKSPACE}"/.github/crates-io.py confirm --version "${RELEASE_TAG#v}" "${CHECKSUM[@]}"
  github-release:
    name: Create the GitHub release
    needs: confirm
    if: always() && needs.confirm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Create the GitHub release
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -o pipefail
          # リリースの一覧は1回で読む。読めなければ止める（照会の失敗を「リリースなし」と見ない）
          RELEASED=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name')
          if grep -qxF "$RELEASE_TAG" <<< "$RELEASED"; then
            echo "the GitHub release ${RELEASE_TAG} already exists"
            exit 0
          fi
          # 基点は、前にある正式版のタグのうち GitHub のリリースがあるもの（公開を確かめた版）。見つからなければ直前のタグ
          PREV_TAG=""
          CANDIDATES=$(git tag --merged "${RELEASE_TAG}^" --list 'v[0-9]*' --sort=-version:refname)
          for CANDIDATE in $CANDIDATES; do
            if [[ "$CANDIDATE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && grep -qxF "$CANDIDATE" <<< "$RELEASED"; then
              PREV_TAG="$CANDIDATE"
              break
            fi
          done
          if [[ -z "$PREV_TAG" ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "${RELEASE_TAG}^")
          fi
          # 古い版のリリースをあとから作るとき、それを Latest にしない（最大の正式版のタグのときだけ --latest）
          LATEST_TAG=$(git tag -l 'v*' | python3 "${GITHUB_WORKSPACE}"/.github/release-gate.py latest-tag)
          LATEST=--latest=false
          if [[ "$LATEST_TAG" == "$RELEASE_TAG" ]]; then
            LATEST=--latest
          fi
          echo "release notes from ${PREV_TAG}; ${LATEST}"
          NOTES="${RUNNER_TEMP}/release-notes.md"
          python3 "${GITHUB_WORKSPACE}"/.github/create-release-note-header.py \
            "$SERVER_URL" "$GITHUB_REPOSITORY" "$PREV_TAG" "$RELEASE_TAG" > "$NOTES"
          LOG=$(git log "${PREV_TAG}..${RELEASE_TAG}" --no-merges --format='%H%x1f%s%x1f%b%x1e')
          printf '%s' "$LOG" | python3 "${GITHUB_WORKSPACE}"/.github/create-release-note-body.py "$SERVER_URL" "$GITHUB_REPOSITORY" >> "$NOTES"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Release ${RELEASE_TAG}" --notes-file "$NOTES" "$LATEST"
