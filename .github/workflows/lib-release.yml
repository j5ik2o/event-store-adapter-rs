name: lib-release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
env:
  CARGO_TERM_COLOR: always
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - name: Check the tag against the crate version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 --manifest-path lib/Cargo.toml \
            | jq -r '.packages[] | select(.name == "event-store-adapter-rs") | .version')
          echo "tag=$GITHUB_REF_NAME, tag version=$TAG_VERSION, crate version=$CRATE_VERSION"
          if [[ "$TAG_VERSION" != "$CRATE_VERSION" ]]; then
            echo "::error::The tag version ($TAG_VERSION) does not match the crate version in lib/Cargo.toml ($CRATE_VERSION)."
            exit 1
          fi
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: release the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish -p event-store-adapter-rs
