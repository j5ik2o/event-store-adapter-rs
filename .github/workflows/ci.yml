name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt -- --check
  test-lib:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test --verbose -p event-store-adapter-rs --all-features
  feature-matrix:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Docker-free configurations run build + tests; the Docker-backed
          # integration tests (dynamodb / bigtable / all-features) stay in
          # test-lib, so those configurations are build-only here.
          - name: no-features
            flags: --no-default-features
            mode: test
          - name: sqlite
            flags: --no-default-features --features sqlite
            mode: test
          - name: sqlite-system
            flags: --no-default-features --features sqlite-system
            mode: test
            system-sqlite: true
          - name: dynamodb
            flags: --no-default-features --features dynamodb
            mode: build
          - name: bigtable
            flags: --no-default-features --features bigtable
            mode: build
          - name: all-features
            flags: --all-features
            mode: build
    name: feature-matrix (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - if: matrix.system-sqlite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - if: matrix.mode == 'build'
        run: cargo build --verbose -p event-store-adapter-rs ${{ matrix.flags }}
      - if: matrix.mode == 'test'
        run: cargo test --verbose -p event-store-adapter-rs ${{ matrix.flags }}
      - name: cloud SDKs must be absent without features
        if: matrix.name == 'no-features'
        run: |
          if cargo tree -p event-store-adapter-rs -e normal --no-default-features | grep -E "aws-|tonic|googleapis"; then
            echo "cloud SDK crates leaked into the featureless dependency graph"
            exit 1
          fi
      - name: hashlink must be absent from the sqlite graph
        if: matrix.name == 'sqlite'
        run: |
          if cargo tree -p event-store-adapter-rs -e normal --no-default-features --features sqlite | grep hashlink; then
            echo "hashlink leaked into the sqlite dependency graph"
            exit 1
          fi
      - name: no hand-written unsafe impl
        if: matrix.name == 'no-features'
        run: |
          if grep -rn "unsafe impl" lib/src/; then
            echo "hand-written unsafe impl Send/Sync is forbidden"
            exit 1
          fi
  clippy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # FR8.5 / NFR6.12: lint every backend, bigtable included. The examples are
        # workspace members that enable the dynamodb / sqlite features of the library,
        # so feature unification widens the effective feature set of each configuration;
        # the per-feature isolation of the library graph stays with the feature-matrix job.
        include:
          - name: no-features
            flags: --no-default-features
          - name: dynamodb
            flags: --no-default-features --features dynamodb
          - name: bigtable
            flags: --no-default-features --features bigtable
          - name: sqlite
            flags: --no-default-features --features sqlite
          - name: sqlite-system
            flags: --no-default-features --features sqlite-system
            system-sqlite: true
          - name: all-features
            flags: --all-features
    name: clippy (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - if: matrix.system-sqlite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: cargo clippy --workspace --all-targets ${{ matrix.flags }} -- -D warnings
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses
  ci-success:
    timeout-minutes: 2
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test-lib, feature-matrix, clippy]
    if: always()
    steps:
      - name: Check CI results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_LIB_RESULT: ${{ needs.test-lib.result }}
          FEATURE_MATRIX_RESULT: ${{ needs.feature-matrix.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" || "$TEST_LIB_RESULT" != "success" || \
                "$FEATURE_MATRIX_RESULT" != "success" || "$CLIPPY_RESULT" != "success" ]]; then
            echo "CI did not succeed: lint=$LINT_RESULT, test-lib=$TEST_LIB_RESULT, feature-matrix=$FEATURE_MATRIX_RESULT, clippy=$CLIPPY_RESULT"
            exit 1
          fi
