name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
env:
  CARGO_TERM_COLOR: always
jobs:
  release-control:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install semver
      - run: python3 -m unittest discover -s .github -p 'test_*.py' -v
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint -shellcheck=''
  lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify conformance data v1.3.0
        run: |
          python3 tools/conformance/manifest.py verify
          echo "0157c012042afa9a19f0bff509a433a4bd5ddc5b674de864a41bec453c460691  conformance/manifest.json" | sha256sum -c -
      - name: Verify API surface 0.1.0
        run: echo "37c91f8f94e10c73513a9c1deef990ea4deea96d5001ae700d6bf799658d0e32  api-surface/surface.json" | sha256sum -c -
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt -- --check
  test-lib:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test --verbose -p event-store-adapter-rs --all-features
  test-conformance-migration:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test -p event-store-adapter-conformance-rs -p event-store-adapter-migration-rs --all-features
  api-surface:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      # rustdoc の JSON を作る nightly。形式の版 61 は rustdoc-types =0.61.0 と組になる。
      # 日付は api-surface/check/src/rustdoc.rs の TOOLCHAIN、api-surface/check/Cargo.toml の rustdoc-types の版と一緒に変える。
      - run: rustup toolchain install nightly-2026-09-27 --profile minimal
      - run: cargo test -p event-store-adapter-api-surface-rs
  feature-matrix:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Docker-free configurations run build + tests; the Docker-backed
          # integration tests (dynamodb / all-features) stay in
          # test-lib, so those configurations are build-only here.
          - name: no-features
            flags: --no-default-features
            mode: test
          - name: dynamodb
            flags: --no-default-features --features dynamodb
            mode: build
          - name: sqlite
            flags: --no-default-features --features sqlite
            mode: test
          - name: sqlite-migration
            flags: --no-default-features --features sqlite-migration
            mode: test
          - name: bigtable
            flags: --no-default-features --features bigtable
            mode: build
          - name: all-features
            flags: --all-features
            mode: build
    name: feature-matrix (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - if: matrix.mode == 'build'
        run: cargo build --verbose -p event-store-adapter-rs ${{ matrix.flags }}
      - if: matrix.mode == 'test'
        run: cargo test --verbose -p event-store-adapter-rs ${{ matrix.flags }}
      - name: cloud SDKs must be absent without features
        if: matrix.name == 'no-features'
        run: |
          if cargo tree -p event-store-adapter-rs -e normal --no-default-features | grep -E "aws-|tonic|prost|googleapis"; then
            echo "cloud SDK crates leaked into the featureless dependency graph"
            exit 1
          fi
      - name: SQLite must be absent without features
        if: matrix.name == 'no-features'
        run: |
          if cargo tree -p event-store-adapter-rs -e normal --no-default-features | grep -E "rusqlite|libsqlite3-sys"; then
            echo "SQLite crates leaked into the featureless dependency graph"
            exit 1
          fi
      - name: cloud SDKs must be absent with only the SQLite migration
        if: matrix.name == 'sqlite-migration'
        run: |
          if cargo tree -p event-store-adapter-rs -e normal --no-default-features --features sqlite-migration | grep -E "aws-|tonic|prost|googleapis"; then
            echo "cloud SDK crates leaked into the sqlite-migration dependency graph"
            exit 1
          fi
      - name: no hand-written unsafe impl
        if: matrix.name == 'no-features'
        run: |
          if grep -rn "unsafe impl" lib/src/; then
            echo "hand-written unsafe impl Send/Sync is forbidden"
            exit 1
          fi
  clippy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # FR8.5 / NFR6.12: lint every supported backend. The examples are
        # workspace members that enable the dynamodb feature of the library,
        # so feature unification widens the effective feature set of each configuration;
        # the per-feature isolation of the library graph stays with the feature-matrix job.
        include:
          - name: no-features
            flags: --no-default-features
          - name: dynamodb
            flags: --no-default-features --features dynamodb
          - name: sqlite
            flags: --no-default-features --features sqlite
          - name: sqlite-migration
            flags: --no-default-features --features sqlite-migration
          - name: bigtable
            flags: --no-default-features --features bigtable
          - name: all-features
            flags: --all-features
    name: clippy (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets ${{ matrix.flags }} -- -D warnings
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses
  conformance:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The dynamodb leg builds the runner with its dynamodb feature; the runner itself starts the
        # digest-pinned DynamoDB Local container. The sqlite leg builds the runner with its sqlite feature and
        # runs each scene on a fresh temporary file (no container). The bigtable leg builds the runner with its bigtable
        # feature; the runner itself starts the digest-pinned Bigtable emulator container and runs each scene on a new
        # journal/head table pair. --require-all fails a leg on any unverified case.
        include:
          - backend: memory
            features: ''
          - backend: dynamodb
            features: --features dynamodb
          - backend: sqlite
            features: --features sqlite
          - backend: bigtable
            features: --features bigtable
    name: conformance (${{ matrix.backend }})
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: python3 tools/conformance/manifest.py verify
      - run: cargo run -p event-store-adapter-conformance-rs --release ${{ matrix.features }} -- --backend ${{ matrix.backend }} --data conformance --report conformance-report-${{ matrix.backend }}.json --require-all
      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-${{ matrix.backend }}
          path: conformance-report-${{ matrix.backend }}.json
          if-no-files-found: warn
      - name: Summarize the conformance report
        if: always()
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from collections import Counter

          backend = os.environ["BACKEND"]
          print(f"### conformance ({backend})")
          try:
              with open(f"conformance-report-{backend}.json", encoding="utf-8") as report_file:
                  cases = json.load(report_file)["cases"]
          except FileNotFoundError:
              print("No report was written.")
          else:
              counts = Counter(case["status"] for case in cases)
              print("| status | cases |")
              print("|---|---|")
              for status in ("passed", "failed", "not-applicable", "unverified"):
                  print(f"| {status} | {counts[status]} |")
              print(f"| total | {len(cases)} |")
          PY
  ci-success:
    timeout-minutes: 2
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test-lib, test-conformance-migration, api-surface, feature-matrix, clippy, release-control, conformance]
    if: always()
    steps:
      - name: Check CI results
        env:
          RELEASE_CONTROL_RESULT: ${{ needs.release-control.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_LIB_RESULT: ${{ needs.test-lib.result }}
          TEST_CONFORMANCE_MIGRATION_RESULT: ${{ needs.test-conformance-migration.result }}
          API_SURFACE_RESULT: ${{ needs.api-surface.result }}
          FEATURE_MATRIX_RESULT: ${{ needs.feature-matrix.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" || "$TEST_LIB_RESULT" != "success" || \
                "$TEST_CONFORMANCE_MIGRATION_RESULT" != "success" || "$API_SURFACE_RESULT" != "success" || \
                "$FEATURE_MATRIX_RESULT" != "success" || "$CLIPPY_RESULT" != "success" || \
                "$RELEASE_CONTROL_RESULT" != "success" || "$CONFORMANCE_RESULT" != "success" ]]; then
            echo "CI did not succeed: lint=$LINT_RESULT, test-lib=$TEST_LIB_RESULT, test-conformance-migration=$TEST_CONFORMANCE_MIGRATION_RESULT, api-surface=$API_SURFACE_RESULT, feature-matrix=$FEATURE_MATRIX_RESULT, clippy=$CLIPPY_RESULT, release-control=$RELEASE_CONTROL_RESULT, conformance=$CONFORMANCE_RESULT"
            exit 1
          fi
