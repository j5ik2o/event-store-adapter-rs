[package]
name = "event-store-adapter-rs"
version = "3.0.0"

description = "Event Store adapter for CQRS/Event Sourcing with DynamoDB, Bigtable, SQLite and in-memory backends"
authors = ["Junichi Kato <j5ik2o@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
# FR8.3: MSRV measured with `cargo build -p event-store-adapter-rs --all-features` on
# 2026-08-28 - the AWS SDK crates (aws-config / aws-sdk-dynamodb and their smithy stack)
# require rustc 1.94.1; 1.94.0 and below fail to resolve. Re-measure when bumping them.
rust-version = "1.94.1"
keywords = ["event-sourcing", "cqrs", "ddd"]
categories = ["data-structures", "web-programming", "rust-patterns"]
readme = "../README.md"
repository = "https://github.com/j5ik2o/event-store-adapter-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# default features are empty, so docs.rs must opt into every backend to document them
[package.metadata.docs.rs]
all-features = true

[features]
default = []
dynamodb = ["dep:aws-config", "dep:aws-sdk-dynamodb"]
bigtable = ["dep:tonic", "dep:googleapis-tonic-google-bigtable-v2"]
sqlite = ["dep:rusqlite", "rusqlite/bundled"]
sqlite-system = ["dep:rusqlite"]

[dependencies]
thiserror = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true, features = ["behavior-version-latest"], optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tonic = { workspace = true, optional = true }
googleapis-tonic-google-bigtable-v2 = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
ulid-generator-rs = { workspace = true, features = ["serde", "uuid"] }
testcontainers = { workspace = true }
once_cell = { workspace = true }
tokio = { workspace = true, features = ["full"] }
event-store-adapter-test-utils-rs = { path = "../test-utils" }
tracing-subscriber = { workspace = true, features = [ "std", "env-filter" ] }
googleapis-tonic-google-bigtable-admin-v2 = { workspace = true }
