[package]
name = "event-store-adapter-rs"
version = "5.1.1"

description = "Event Store adapter for CQRS/Event Sourcing with DynamoDB and in-memory backends"
authors = ["Junichi Kato <j5ik2o@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
# FR8.3: MSRV measured with `cargo build -p event-store-adapter-rs --all-features` on
# 2026-08-28 - the AWS SDK crates (aws-config / aws-sdk-dynamodb and their smithy stack)
# require rustc 1.94.1; 1.94.0 and below fail to resolve. Re-measure when bumping them.
rust-version = "1.94.1"
keywords = ["event-sourcing", "cqrs", "ddd"]
categories = ["data-structures", "web-programming", "rust-patterns"]
readme = "../README.md"
repository = "https://github.com/j5ik2o/event-store-adapter-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# default features are empty, so docs.rs must opt into every backend to document them
[package.metadata.docs.rs]
all-features = true

[features]
default = []
test-hooks = []
dynamodb = ["dep:aws-sdk-dynamodb", "dep:uuid"]
migration = ["dynamodb"]
sqlite-migration = ["sqlite"]
sqlite = ["dep:rusqlite", "dep:uuid"]
bigtable = ["dep:tonic", "dep:googleapis-tonic-google-bigtable-v2", "dep:googleapis-tonic-google-bigtable-admin-v2", "dep:uuid"]
bigtable-migration = ["bigtable"]
spanner = [
  "dep:tonic",
  "dep:googleapis-tonic-google-spanner-v1",
  "dep:googleapis-tonic-google-spanner-admin-database-v1",
  "dep:prost-types",
  "dep:base64",
  "dep:tokio",
  "dep:uuid",
]

[dependencies]
thiserror = { workspace = true }
async-trait = { workspace = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
rusqlite = { workspace = true, optional = true, features = ["bundled"] }
# Bigtable のデータ API と管理 API の gRPC。機能 `bigtable` を付けないビルドには入らない。
tonic = { workspace = true, optional = true, features = ["channel", "codegen"] }
googleapis-tonic-google-bigtable-v2 = { workspace = true, optional = true }
googleapis-tonic-google-bigtable-admin-v2 = { workspace = true, optional = true }
# Spanner のデータ API と管理 API の gRPC。機能 `spanner` を付けないビルドには入らない。
googleapis-tonic-google-spanner-v1 = { workspace = true, optional = true }
googleapis-tonic-google-spanner-admin-database-v1 = { workspace = true, optional = true }
prost-types = { version = "0.14.4", optional = true }
base64 = { version = "0.22.1", optional = true }
# 中断（ABORTED）の再試行の前に待つ。
tokio = { workspace = true, optional = true, features = ["time"] }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
aws-smithy-runtime-api = { version = "1.19.0", features = ["client"] }
aws-smithy-types = "1.8.1"
aws-smithy-http-client = { version = "1.5.0", features = ["default-client", "rt-tokio"] }
testcontainers = { workspace = true }
tokio = { workspace = true, features = ["full"] }
event-store-adapter-test-utils-rs = { path = "../test-utils" }
tracing-subscriber = { workspace = true, features = [ "std", "env-filter" ] }
