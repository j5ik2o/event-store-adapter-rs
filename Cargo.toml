[workspace]
members = ["lib", "test-utils", "examples/*", "conformance-runner", "migration-cli", "api-surface/check", "api-surface/fixtures"]

resolver = "2"

[workspace.dependencies]
chrono = "0.4.38"
anyhow = "1.0.82"
thiserror = "2.0.0"
async-trait = "0.1.80"
aws-config = "1.2.1"
aws-sdk-dynamodb = { version = "1.68.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
serde = "1.0"
serde_json = "1.0"
ulid-generator-rs = "0.0.112"
testcontainers = "0.28.0"
once_cell = "1.19.0"
tokio = "1.37.0"
rusqlite = { version = "0.41.0", default-features = false }
tonic = { version = "0.14.6", default-features = false }
gcp_auth = "0.12.7"
googleapis-tonic-google-bigtable-v2 = "0.39.0"
googleapis-tonic-google-bigtable-admin-v2 = "0.45.0"
googleapis-tonic-google-spanner-v1 = "0.45.0"
googleapis-tonic-google-spanner-admin-database-v1 = "0.40.0"

tracing = "0.1"
tracing-subscriber = "0.3"

# RUSTSEC-2026-0440 と Issue #349 への対応。testcontainers 0.28.0 は未保守の
# astral-tokio-tar を依存に持ち、公開版に修正が無いため、astral-tokio-tar を
# tar へ置き換える上流 PR #1006 のコミットへ固定して依存グラフから取り除く。
# https://github.com/testcontainers/testcontainers-rs/pull/1006
# 解除条件: astral-tokio-tar 非依存の最初の公開版（0.29.0 が有力）へ上げる際に
# この patch を削除する。
[patch.crates-io]
testcontainers = { git = "https://github.com/testcontainers/testcontainers-rs", rev = "dba4383d9bdbaed68d499f6e3ba933a289ba0a4a" }
